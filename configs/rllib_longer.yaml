game:
  players: 3
  seed: 101
  max_turns: 500
  include_cards:
  exclude_cards: []
  enabled_combo_rules:
    - two_of_a_kind
  reveal_opponent_card_counts: false

training:
  iterations: 500
  train_batch_size: 2048
  minibatch_size: 256
  rollout_fragment_length: 256
  num_epochs: 5
  lr: 0.0001
  num_env_runners: 0

experiment:
  checkpoint_dir: models/rllib
  run_name: rllib_shared_policy_longer
  checkpoint_interval: 25
  evaluation_interval: 25
  evaluation_episodes: 25
  evaluation_opponents:
    - random
    - safe-rule
    - draw-only
  wandb_mode: offline
  wandb_project: exploding-kittens
  wandb_entity:
  show_progress: true
  suppress_ray_warnings: true

dashboard_logging:
  enabled: true
  experiment_dir: reports/experiments
  run_name:
  flush_each_iteration: true
