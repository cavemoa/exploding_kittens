game:
  players: 3
  seed: 11
  max_turns: 500
  include_cards:
  exclude_cards: []
  enabled_combo_rules:
    - two_of_a_kind
  reveal_opponent_card_counts: false

training:
  iterations: 50
  train_batch_size: 512
  minibatch_size: 128
  rollout_fragment_length: 128
  num_epochs: 3
  lr: 0.0003
  num_env_runners: 0

experiment:
  checkpoint_dir: models/rllib
  run_name: rllib_shared_policy_medium
  checkpoint_interval: 10
  evaluation_interval: 10
  evaluation_episodes: 10
  evaluation_opponents:
    - random
    - safe-rule
    - draw-only
  wandb_mode: offline
  wandb_project: exploding-kittens
  wandb_entity:
  show_progress: true
  suppress_ray_warnings: true

dashboard_logging:
  enabled: true
  experiment_dir: reports/experiments
  run_name:
  flush_each_iteration: true
