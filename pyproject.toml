[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exploding-kittens-sim"
version = "0.1.0"
description = "A small pure Python Exploding Kittens simulation for learning game engines and agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
    "pettingzoo>=1.24",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
tracking = [
    "wandb>=0.17",
]
training = [
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
]
multiagent = [
    "ray[rllib]>=2.40",
]
ui = [
    "flet[all]>=0.85.2",
    "flet-charts>=0.85.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
